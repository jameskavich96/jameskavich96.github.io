# nginx server block for the portfolio (static Astro build).
# Drop into /etc/nginx/sites-available/, symlink to sites-enabled, `nginx -t && systemctl reload nginx`.
# HTTPS: run `certbot --nginx -d drjames.dev` after DNS points here — certbot rewrites this block
# for TLS. Required before the site loads at all: .dev is HSTS-preloaded, browsers refuse plain HTTP.

server {
    listen 80;
    listen [::]:80;
    server_name drjames.dev;

    root /var/www/james-portfolio;
    index index.html;

    # security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    # enable HSTS only AFTER HTTPS works:
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # CSP — the sha256 hash covers the one deliberate inline script (the html.js gate
    # in src/layouts/Base.astro). If that script ever changes, recompute its hash.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'sha256-ZnYJX5ypMaaAhxxWhSEjbMkhO2A9yPmbzEQH3LFaITA='; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; frame-src 'none'; object-src 'none'; base-uri 'self'" always;

    # hashed assets: cache forever
    location /_astro/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/index.html =404;
    }
}
